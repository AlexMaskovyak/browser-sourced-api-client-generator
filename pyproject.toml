[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "browser-sourced-api-client-generator"
version = "0.1.0"
description = "Generate standalone Python clients from authenticated websites"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["websocket-client>=1.9,<2"]

[tool.poetry]
requires-poetry = ">=2.2,<3.0"
packages = [{ include = "website_client", from = "src" }]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
website-client = "website_client.cli:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
