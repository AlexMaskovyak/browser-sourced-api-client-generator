[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "browser-sourced-api-client-generator"
version = "0.1.0"
description = "Generate standalone Python clients from authenticated websites"
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = "MIT"
dependencies = ["graphql-core (>=3.2,<3.4)", "openapi-spec-validator (>=0.7,<0.9)", "pyyaml (>=6,<7)", "openapi-python-client (==0.29.1)", "ariadne-codegen (==0.19.0)", "httpx (>=0.28,<0.29)", "playwright (==1.64.1)", "jsonschema (>=4.23,<5)", "platformdirs (>=4.3,<5)", "filelock (>=3.20,<4)", "requests (>=2.32,<3)", "jsonpointer (>=3,<4)", "arazzo-runner (==0.9.6+websiteclient.1)", "openapi-schema-validator (>=0.6,<0.9)"]

[tool.poetry]
requires-poetry = ">=2.2,<3.0"
packages = [{ include = "website_client", from = "src" }]

[dependency-groups]
dev = ["pytest>=8,<10", "pdm-backend (==2.5.0)", "ruff (==0.15.22)", "poetry-core (==2.5.0)"]

[project.scripts]
website-client = "website_client.cli:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.poetry.dependencies]
arazzo-runner = { path = "src/website_client/native_dependencies/arazzo_runner-0.9.6+websiteclient.1-py3-none-any.whl" }

# These commands check only the integration modules introduced or refactored here:
# poetry run ruff check
# poetry run ruff format --check
[tool.ruff]
target-version = "py311"
include = [
    "src/website_client/cli.py",
    "src/website_client/generation.py",
    "src/website_client/operation_generation.py",
    "src/website_client/project_metadata.py",
    "src/website_client/self_discovery.py",
    "src/website_client/bundle_capture.py",
    "src/website_client/admission.py",
    "src/website_client/privacy.py",
    "src/website_client/graphql_admission.py",
    "src/website_client/har_inference.py",
    "src/website_client/client_runtime.py",
    "src/website_client/client_cli.py",
    "src/website_client/result_output.py",
    "src/website_client/autonomous.py",
    "src/website_client/authenticated_http.py",
    "src/website_client/capabilities.py",
    "src/website_client/native_files.py",
    "src/website_client/runtime_profile.py",
    "src/website_client/workflow_*.py",
    "src/website_client/native_dependencies/rebuild.py",
]
