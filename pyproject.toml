[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-sourced-api-client-generator"
version = "0.1.0"
description = "Generate standalone Python clients from authenticated websites"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["websocket-client>=1.9,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "setuptools>=77"]

[project.scripts]
website-client = "website_client.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
