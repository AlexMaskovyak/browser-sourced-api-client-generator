[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "browser-sourced-api-client-generator"
version = "0.1.0"
description = "Generate standalone Python clients from authenticated websites"
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = "MIT"
dependencies = ["graphql-core (>=3.2,<3.4)", "openapi-spec-validator (>=0.7,<0.9)", "pyyaml (>=6,<7)", "openapi-python-client (>=0.27,<0.40)", "ariadne-codegen (>=0.15,<0.30)", "httpx (>=0.28,<0.29)", "playwright (>=1.58,<2)"]

[tool.poetry]
requires-poetry = ">=2.2,<3.0"
packages = [{ include = "website_client", from = "src" }]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
website-client = "website_client.cli:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
